server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Controller API (backend lifecycle, generation, clip library).
    location /api/ {
        proxy_pass http://controller:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Starting a backend or synthesising long text can take minutes.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
